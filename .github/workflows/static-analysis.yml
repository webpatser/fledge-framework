name: static analysis

on:
  push:
    branches:
      - master
      - '*.x'
      - 'fledge-*'
  pull_request:

permissions:
  contents: read

jobs:
  types:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    strategy:
      fail-fast: true
      matrix:
        # The src leg ("Source Code", phpstan.src.neon.dist) is disabled since v13.44.1.4: PHPStan 2.3.5
        # crashes with an internal error on the ? placeholder of PHP 8.6 partial application
        # (ArgumentsHandler::matchArgParameter receives an ArgPlaceholder). Restore [src, types] once a PHPStan release analyses src without that crash.
        directory: [types]

    name: ${{ matrix.directory == 'src' && 'Source Code' || 'Types' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP project
        uses: ./.github/actions/setup-php-project

      - name: Execute type checking
        run: vendor/bin/phpstan --configuration="phpstan.${{ matrix.directory }}.neon.dist" --no-progress
